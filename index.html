['Apa itu puasa?','think',`<p>Menurut bahasa, puasa berarti <b>menahan</b>. Menurut istilah, puasa berarti menahan diri dari hal-hal yang membatalkan puasa, mulai <b>terbit fajar</b> sampai <b>terbenam matahari</b>.</p><p>Puasa adalah <b>rukun Islam ketiga</b>. Puasa Ramadan hukumnya wajib, selama 29 atau 30 hari.</p>${AR('يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ كُتِبَ عَلَيْكُمُ ٱلصِّيَامُ كَمَا كُتِبَ عَلَى ٱلَّذِينَ مِن قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ')}<p class="sm">“Wahai orang-orang yang beriman! Diwajibkan atas kamu berpuasa sebagaimana diwajibkan atas orang sebelum kamu agar kamu bertakwa.” (QS. al-Baqarah/2:183)</p><a class="b p" href="${V}">▶ Tonton video pembelajaran</a>`],

 $('#pv').onclick=()=>{i--;r()};$('#nt').onclick=()=>{if(i<M.length-1){i++;r();window.scrollTo(0,0)}else{done('materi');go('aktivitas')}};

aktivitas(){const L=[['menahan diri','c','Ingat arti puasa menurut bahasa.'],['puasa Senin Kamis','a','Puasa ini boleh dikerjakan, tetapi tidak wajib.'],['terbenam matahari','d','Saat itu azan magrib berkumandang.'],['QS. al-Baqarah 183','b','Ayat ini berisi perintah berpuasa.']],R={a:'puasa sunnah',b:'dalil tentang puasa',c:'puasa secara bahasa',d:'waktu berbuka'};let sel=null,n=0;
 $('#m').innerHTML=`<h1>Tugasku: pasangkan</h1>${bub('think','Ketuk satu pernyataan di kolom A, lalu ketuk pasangannya di kolom B.')}<div class="g2"><div id="la">${L.map(x=>`<button class="b op" data-k="${x[1]}" data-h="${x[2]}">${x[0]}</button>`).join('')}</div><div id="ra">${sh(Object.keys(R)).map(k=>`<button class="b op" data-k="${k}">${R[k]}</button>`).join('')}</div></div><div id="fb" role="status" aria-live="polite"></div>`;
 const fb=$('#fb');document.querySelectorAll('#la .b').forEach(b=>b.onclick=()=>{if(b.disabled)return;document.querySelectorAll('#la .b').forEach(x=>x.classList.remove('on'));b.classList.add('on');sel=b;fb.innerHTML=''});
 document.querySelectorAll('#ra .b').forEach(b=>b.onclick=()=>{if(b.disabled)return;if(!sel){fb.innerHTML='<p class="f no">Pilih dulu pernyataan di kolom A.</p>';return}
  if(sel.dataset.k==b.dataset.k){[sel,b].forEach(x=>{x.classList.remove('on');x.classList.add('ok','bn');x.disabled=true;x.insertAdjacentHTML('afterbegin','✓ ')});sel=null;n++;fb.innerHTML='<p class="f ok">✓ Tepat sekali!</p>';if(n==4){fb.innerHTML='<p class="f ok bn">⭐ Hebat! Semua pasangan benar. Lanjut ke game ya.</p>';done('aktivitas')}}
  else{b.classList.add('no','sh');setTimeout(()=>b.classList.remove('no','sh'),500);fb.innerHTML=`<p class="f no">✗ Belum cocok. Petunjuk: ${sel.dataset.h}</p>`}})},
game(){const I=[['Sahur','s'],['Berbuka dengan kurma','s'],['Memperbanyak sedekah','s'],['Membaca Al-Qur’an','s'],['Makan dengan sengaja','m'],['Muntah dengan sengaja','m'],['Haid dan nifas','m'],['Murtad','m'],['Baligh','b'],['Berakal','b'],['Mampu berpuasa','b'],['Beragama Islam','b']],B={s:'Sunnah puasa',m:'Membatalkan puasa',b:'Syarat wajib puasa'},H={s:'perbuatan baik yang menambah pahala, tetapi puasa tetap sah jika ditinggalkan.',m:'hal yang membuat puasa menjadi batal jika dilakukan.',b:'sifat yang harus dimiliki seseorang agar wajib berpuasa.'};
 let q,i=0,sc=0,er=0;const start=()=>{q=sh(I);i=0;sc=0;er=0;dr()};
 const dr=()=>{if(i>=q.length){const st=er<=2?3:er<=5?2:1;done('game');$('#m').innerHTML=`<h1>Game selesai!</h1><div class="c" style="text-align:center">${mas('proud',100)}<div class="big">${'⭐'.repeat(st)}</div><p>Skor: <b>${sc}</b> dari 120 · Salah menebak: ${er} kali</p><button class="b p" id="ag">🔁 Main lagi</button></div>`;$('#ag').onclick=start;return}
  $('#m').innerHTML=`<h1>Game: kelompokkan kartu</h1><p class="sm">Kartu ${i+1} dari ${q.length} · Skor ${sc}. Seret kartu ke kelompok yang tepat, atau ketuk kelompoknya.</p><div class="pb"><i style="width:${100*i/q.length}%"></i></div><div class="c" id="cd" draggable="true" style="text-align:center;cursor:grab"><span class="d" style="font-size:1.6rem">${q[i][0]}</span></div><div class="g2">${Object.keys(B).map(k=>`<button class="b" data-k="${k}" style="min-height:80px">${B[k]}</button>`).join('')}</div><div id="fb" role="status" aria-live="polite"></div>`;
  $('#cd').ondragstart=e=>e.dataTransfer.setData('text','x');
  document.querySelectorAll('.g2 .b').forEach(b=>{const t=()=>{if(b.dataset.k==q[i][1]){sc+=10;i++;dr()}else{er++;$('#cd').classList.add('sh');b.classList.add('no','sh');$('#fb').innerHTML=`<p class="f no">✗ Belum tepat. Petunjuk: kelompok yang benar berisi ${H[q[i][1]]}</p>`;setTimeout(()=>{b.classList.remove('no','sh');$('#cd').classList.remove('sh')},500)}};b.onclick=t;b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();t()}})};start()},
latihan(){$('#m').innerHTML=`<h1>Latihan</h1>${bub('happy','5 soal latihan. Kalau jawabanmu belum tepat, aku beri petunjuk dan kamu boleh mencoba lagi.')}<button class="b p" id="s">Mulai latihan</button><div id="bx"></div>`;$('#s').onclick=()=>{$('#s').hidden=true;qz(LT,'lat',$('#bx'),r=>{done('latihan');$('#bx').innerHTML=`<div class="c" style="text-align:center">${mas(r.ok>=4?'proud':'happy',100)}<h2>Benar pada percobaan pertama: ${r.ok} dari ${r.n}</h2><p>${r.ok>=4?'Luar biasa! Kamu siap mengerjakan kuis.':'Tidak apa-apa. Baca materi sekali lagi, lalu coba latihan lagi.'}</p><button class="b" id="r1">🔁 Ulangi latihan</button> <button class="b p" id="r2">❓ Ke kuis</button></div>`;$('#r1').onclick=()=>pg.latihan();$('#r2').onclick=()=>go('kuis')})}},

hasil(){const b=S.best;if(!b){$('#m').innerHTML=`<h1>Hasil belajar</h1>${bub('think','Kamu belum mengerjakan kuis. Ayo kerjakan dulu!')}<button class="b p" id="k">❓ Ke kuis</button>`;$('#k').onclick=()=>go('kuis');return}
 const sc=b.ok*10,bd=sc>=90?['🏆','Luar Biasa!']:sc>=70?['🥇','Hebat!']:['💪','Tetap Semangat!'],tp=[...new Set(b.ko)],m=Math.floor(b.sec/60),s=String(b.sec%60).padStart(2,'0');
 $('#m').innerHTML=`<h1>Hasil belajar</h1><div class="c" style="text-align:center">${mas(sc>=70?'proud':'happy',100)}<div class="big">${bd[0]} ${sc}</div><h2>${bd[1]}</h2><p>✓ Benar: <b>${b.ok}</b> · ✗ Salah: <b>${b.n-b.ok}</b> · ⏱ Waktu: <b>${m}:${s}</b></p></div><div class="c"><h2>Ringkasan materi</h2><ul><li>Puasa berarti menahan diri dari terbit fajar sampai terbenam matahari.</li><li>Rukun puasa: niat dan menahan diri.</li><li>Syarat wajib: Islam, baligh, berakal, mukim, mampu.</li><li>Allah menjanjikan pintu surga Al-Rayyān bagi yang berpuasa.</li><li>Hikmah: tubuh sehat, sabar, pengendalian diri, peduli pada sesama.</li></ul></div><div class="c"><h2>Rekomendasi belajar</h2>${tp.length?'<p>Ulangi bagian ini agar makin paham:</p>'+tp.map(t=>`<button class="b" data-t="${t}" style="margin:4px">📖 ${M[t][0]}</button>`).join(''):'<p>✓ Semua bagian sudah kamu kuasai. Pertahankan ya!</p>'}</div><button class="b p" id="k">🔁 Ulangi kuis</button>`;
 document.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{S.mi=+x.dataset.t;go('materi')});$('#k').onclick=()=>go('kuis')},
refleksi(){const r=S.ref||{},G=(k,a)=>`<div class="chs" data-g="${k}">${a.map(x=>`<button class="b ${r[k]==x?'on':''}" aria-pressed="${r[k]==x}">${x}</button>`).join('')}</div>`;
 $('#m').innerHTML=`<h1>Refleksi</h1>${bub('happy','Yuk, ceritakan pengalaman belajarmu hari ini.')}<div class="c"><h2>Bagaimana perasaanmu?</h2>${G('mood',['😄 Senang','🙂 Biasa saja','😕 Bingung'])}<h2>Apa yang paling kamu sukai?</h2>${G('suka',['Materi','Aktivitas','Game','Latihan','Kuis'])}<h2>Bagian mana yang masih sulit?</h2>${G('sulit',['Pengertian','Syarat','Rukun dan niat','Sunnah','Yang membatalkan','Hikmah','Doa berbuka','Tidak ada'])}<h2>Apa yang ingin kamu pelajari lebih lanjut?</h2><textarea id="tx" aria-label="Yang ingin dipelajari">${r.tx||''}</textarea><p><button class="b p" id="sv">Kirim refleksiku</button></p><div id="rs" role="status" aria-live="polite"></div></div>`;
 document.querySelectorAll('[data-g]').forEach(g=>g.querySelectorAll('.b').forEach(b=>b.onclick=()=>{r[g.dataset.g]=b.textContent;g.querySelectorAll('.b').forEach(x=>{x.classList.toggle('on',x==b);x.setAttribute('aria-pressed',x==b)})}));
 $('#sv').onclick=()=>{if(!r.mood||!r.suka||!r.sulit){$('#rs').innerHTML='<p class="f no">Pilih perasaan, bagian yang kamu sukai, dan bagian yang masih sulit dulu ya.</p>';return}

  $('#ul').onclick=()=>{S={d:{},p:'cover'};sv();draw()};$('#mn').onclick=()=>go('home')}},
petunjuk(){$('#m').innerHTML=`<h1>Petunjuk penggunaan</h1><div class="c"><ol><li>Ketuk menu di bagian atas untuk berpindah halaman. Tombol Kembali, Beranda, dan Lanjut selalu ada di bawah.</li><li>Pelajari Materi sampai selesai. Gunakan tombol “Uji hafalanku” untuk menghafal doa.</li><li>Kerjakan Aktivitas (memasangkan) dan Game (mengelompokkan kartu).</li><li>Latihan boleh diulang dan memberi petunjuk. Kuis hanya sekali jalan dan soalnya diacak.</li><li>Lihat skor di Hasil, lalu isi Refleksi.</li><li>Kemajuan belajarmu tersimpan otomatis di perangkat ini.</li></ol><p class="sm">Pintasan keyboard: panah kiri dan kanan untuk Kembali dan Lanjut.</p></div>`}};
function qz(list,mode,box,fin){let i=0,ok=0,ko=[];const t0=Date.now(),L=sh(list).map(q=>({q:q[0],o:sh(q[1].map((t,k)=>({t,c:!k}))),h:q[2],e:q[3],tp:q[4]}));
 const show=()=>{const q=L[i];let tr=0,lock=0;box.innerHTML=`<div class="pb"><i style="width:${Math.round(100*i/L.length)}%"></i></div><p class="sm">Soal ${i+1} dari ${L.length}</p><div class="c"><div class="mb">${mas('happy',64)}<div class="bb"><b>${q.q}</b></div></div>${q.o.map((o,k)=>`<button class="b op" data-k="${k}"><span class="lt">${'ABCD'[k]}</span>${o.t}</button>`).join('')}<div id="fb" role="status" aria-live="polite"></div><button class="b p" id="nq" hidden>${i+1<L.length?'Soal berikutnya ▶':'Selesai ✓'}</button></div>`;
  const bs=[...box.querySelectorAll('.op')],fb=box.querySelector('#fb'),nq=box.querySelector('#nq'),mk=(b,c)=>b.insertAdjacentHTML('afterbegin',c?'<b>&nbsp;✓ Benar&nbsp;</b>':'<b>&nbsp;✗ Salah&nbsp;</b>');
  bs.forEach(b=>b.onclick=()=>{if(lock)return;const o=q.o[b.dataset.k];
   if(o.c){lock=1;if(!tr)ok++;b.classList.add('ok','bn');mk(b,1);fb.innerHTML=`<p class="f ok">✓ Benar! ${q.e}</p>`;nq.hidden=false}
   else{tr++;b.classList.add('no','sh');b.disabled=true;mk(b,0);
    if(mode=='kuis'){lock=1;ko.push(q.tp);bs.forEach((x,k)=>{if(q.o[k].c){x.classList.add('ok');mk(x,1)}});fb.innerHTML=`<p class="f no">✗ Belum tepat. ${q.e}</p>`;nq.hidden=false}
    else fb.innerHTML=`<p class="f no">✗ Belum tepat. Petunjuk: ${q.h} Ayo coba lagi!</p>`}});
  nq.onclick=()=>{i++;if(i<L.length){show();box.scrollIntoView()}else fin({ok,n:L.length,ko,sec:Math.round((Date.now()-t0)/1000)})}};show()}
document.onkeydown=e=>{if(/TEXTAREA|INPUT/.test(e.target.tagName))return;if(e.key=='ArrowRight'){const n=$('#nx');n&&!n.disabled&&n.click()}if(e.key=='ArrowLeft'){const n=$('#bk');n&&!n.disabled&&n.click()}};
